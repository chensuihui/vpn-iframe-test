<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内部 VPN 测试结果</title>
<style>body{font:15px system-ui,sans-serif;margin:18px}pre{background:#f5f5f5;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}button{padding:8px 14px}</style></head>
<body><h2>内部页面已渲染</h2><p id="status">正在请求同源后端…</p><button id="retry">重新检测</button><pre id="output"></pre>
<script>
async function check(){const status=document.querySelector('#status'),out=document.querySelector('#output');status.textContent='请求中…';
try{const r=await fetch('/api/request-info',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();status.textContent='同源 API 请求成功';out.textContent=JSON.stringify(data,null,2)}catch(e){status.textContent='请求失败';out.textContent=String(e)}}
document.querySelector('#retry').onclick=check;check();
</script></body></html>
